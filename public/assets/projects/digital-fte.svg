<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Glow circle behind agents -->
  <circle cx="580" cy="250" r="180" fill="url(#glow)"/>

  <!-- Agent cards -->
  <!-- Agent 1 - Email -->
  <g transform="translate(420, 120)">
    <rect width="120" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="24" y="29" font-family="monospace" font-size="14" fill="#60a5fa" text-anchor="middle">&#9993;</text>
    <text x="70" y="24" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AGENT</text>
    <text x="70" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Email</text>
    <rect x="20" y="58" width="80" height="4" rx="2" fill="#334155"/>
    <rect x="20" y="58" width="55" height="4" rx="2" fill="#3b82f6"/>
    <text x="70" y="76" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">AUTONOMOUS</text>
  </g>

  <!-- Agent 2 - Reporting (center, larger) -->
  <g transform="translate(520, 90)">
    <rect width="140" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="32" rx="8" fill="#3b82f6" opacity="0.2"/>
    <text x="28" y="34" font-family="sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">&#x1F4CA;</text>
    <text x="84" y="28" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">AGENT</text>
    <text x="84" y="48" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Reporting</text>
    <rect x="22" y="65" width="96" height="4" rx="2" fill="#334155"/>
    <rect x="22" y="65" width="72" height="4" rx="2" fill="#3b82f6"/>
    <rect x="22" y="75" width="96" height="4" rx="2" fill="#334155"/>
    <rect x="22" y="75" width="48" height="4" rx="2" fill="#60a5fa"/>
    <text x="84" y="98" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">AUTONOMOUS</text>
  </g>

  <!-- Agent 3 - Operations -->
  <g transform="translate(420, 250)">
    <rect width="120" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="24" y="29" font-family="sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle">&#x2699;</text>
    <text x="70" y="24" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AGENT</text>
    <text x="70" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Operations</text>
    <rect x="20" y="58" width="80" height="4" rx="2" fill="#334155"/>
    <rect x="20" y="58" width="60" height="4" rx="2" fill="#3b82f6"/>
    <text x="70" y="76" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">AUTONOMOUS</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
    <line x1="480" y1="200" x2="560" y2="190"/>
    <line x1="480" y1="200" x2="560" y2="290"/>
    <line x1="540" y1="180" x2="540" y2="250"/>
  </g>

  <!-- Tier badge -->
  <g transform="translate(620, 220)">
    <rect width="100" height="28" rx="14" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="50" y="18" font-family="monospace" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="600">PLATINUM TIER</text>
  </g>

  <!-- Text content -->
  <g>
    <text x="60" y="160" font-family="sans-serif" font-size="11" fill="#3b82f6" font-weight="600" letter-spacing="3">OPENAI AGENTS SDK</text>
    <text x="60" y="200" font-family="sans-serif" font-size="40" fill="#f1f5f9" font-weight="800">Digital FTE</text>
    <text x="60" y="230" font-family="sans-serif" font-size="16" fill="#94a3b8">AI employees that work like</text>
    <text x="60" y="252" font-family="sans-serif" font-size="16" fill="#94a3b8">full-time staff — 24/7.</text>

    <!-- Tier indicators -->
    <g transform="translate(60, 290)">
      <rect width="60" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="16" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">BRONZE</text>
    </g>
    <g transform="translate(130, 290)">
      <rect width="60" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="16" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">SILVER</text>
    </g>
    <g transform="translate(200, 290)">
      <rect width="60" height="24" rx="4" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
      <text x="30" y="16" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">GOLD</text>
    </g>
    <g transform="translate(270, 290)">
      <rect width="72" height="24" rx="4" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
      <text x="36" y="16" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">PLATINUM</text>
    </g>
  </g>

  <!-- Bottom line -->
  <rect x="60" y="340" width="200" height="2" rx="1" fill="url(#accent)"/>
</svg>