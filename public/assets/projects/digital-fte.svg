<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Glow behind diagram -->
  <circle cx="560" cy="230" r="170" fill="url(#glow)"/>

  <!-- Architecture diagram -->
  <!-- Claude Code - central brain -->
  <g transform="translate(500, 150)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="2"/>
    <rect x="10" y="10" width="30" height="30" rx="8" fill="#d97706" opacity="0.2"/>
    <text x="25" y="32" font-family="sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">&#x1F9E0;</text>
    <text x="76" y="30" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">POWERED BY</text>
    <text x="76" y="48" font-family="sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle" font-weight="700">Claude Code</text>
    <text x="60" y="70" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">GENERAL AGENT</text>
  </g>

  <!-- Obsidian Vault - memory -->
  <g transform="translate(440, 280)">
    <rect width="110" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="26" height="26" rx="6" fill="#7c3aed" opacity="0.2"/>
    <text x="23" y="29" font-family="sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle">&#x1F4C1;</text>
    <text x="72" y="24" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">MEMORY</text>
    <text x="72" y="40" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Obsidian</text>
    <text x="72" y="56" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">VAULT + FILES</text>
  </g>

  <!-- MCPs - tools -->
  <g transform="translate(570, 280)">
    <rect width="110" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="26" height="26" rx="6" fill="#0891b2" opacity="0.2"/>
    <text x="23" y="29" font-family="sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle">&#x2699;</text>
    <text x="72" y="24" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">TOOLS</text>
    <text x="72" y="40" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">MCPs</text>
    <text x="72" y="56" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">PROTOCOL</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#d97706" stroke-width="1.5" opacity="0.4">
    <line x1="560" y1="230" x2="495" y2="280"/>
    <line x1="560" y1="230" x2="625" y2="280"/>
  </g>

  <!-- Tier badge -->
  <g transform="translate(630, 170)">
    <rect width="90" height="24" rx="12" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1"/>
    <text x="45" y="16" font-family="monospace" font-size="8" fill="#f59e0b" text-anchor="middle" font-weight="600">PLATINUM TIER</text>
  </g>

  <!-- Text content -->
  <g>
    <text x="60" y="140" font-family="sans-serif" font-size="11" fill="#d97706" font-weight="600" letter-spacing="3">AI AGENT SYSTEM</text>
    <text x="60" y="180" font-family="sans-serif" font-size="40" fill="#f1f5f9" font-weight="800">Digital FTE</text>
    <text x="60" y="210" font-family="sans-serif" font-size="15" fill="#94a3b8">Autonomous AI employees that</text>
    <text x="60" y="232" font-family="sans-serif" font-size="15" fill="#94a3b8">handle business operations.</text>

    <!-- Tech stack labels -->
    <g transform="translate(60, 268)">
      <rect width="80" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="40" y="15" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">CLAUDE CODE</text>
    </g>
    <g transform="translate(150, 268)">
      <rect width="80" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="40" y="15" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">OBSIDIAN</text>
    </g>
    <g transform="translate(240, 268)">
      <rect width="50" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="25" y="15" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">MCPS</text>
    </g>
    <g transform="translate(300, 268)">
      <rect width="60" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">PYTHON</text>
    </g>
  </g>

  <!-- Bottom line -->
  <rect x="60" y="320" width="180" height="2" rx="1" fill="url(#accent)"/>
</svg>