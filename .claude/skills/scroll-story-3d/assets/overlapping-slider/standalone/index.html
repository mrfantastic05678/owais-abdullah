<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlapping Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="slider-container">
    <div class="slider-left">
      <h2 class="slider-title">Star<br />Inspired</h2>
      <p class="slider-desc">A collection of wisdom from great minds to fuel your daily motivation</p>
    </div>

    <div class="slider-right">
      <div class="slider-track" id="slider-track"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
